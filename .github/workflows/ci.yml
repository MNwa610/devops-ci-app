name: CI — проверка и публикация образа

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Настройка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Статический анализ Pylint
        run: python -m pylint app --score=no

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Настройка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Запуск модульных тестов
        run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Приведение имени образа к нижнему регистру
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Сборка Docker-образа для локальной проверки
        run: docker build --tag "devops-ci-app:${GITHUB_SHA}" .

      - name: Проверка запуска контейнера
        run: |
          set -euo pipefail

          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d --name smoke \
            -p 127.0.0.1:5000:5000 \
            "devops-ci-app:${GITHUB_SHA}"

          ready=0

          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::/health не ответил после 15 попыток"
            exit 1
          fi

          python3 -m json.tool health.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("health.json").read_text(encoding="utf-8")
          )
          assert payload == {"status": "ok"}, (
              f"Неожиданный ответ /health: {payload}"
          )
          PY

          docker exec smoke id

      - name: Авторизация в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Настройка QEMU (эмуляция arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Настройка Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация мультиархитектурного образа
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest